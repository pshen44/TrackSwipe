<!DOCTYPE html>
<html>
  <body>
    <a id="login-link" href="#">Login to Spotify</a>
    <script>
      const clientId = '06b9dadfd2144324a7ed4d37dbe1245f';
      const redirectUri = window.location.origin;
      const scope = 'playlist-read-private playlist-modify-private playlist-modify-public';
      const params = new URLSearchParams({
        client_id: clientId,
        redirect_uri: redirectUri,
        response_type: 'code',
        scope: scope
      });
      document.getElementById('login-link').href =
        `https://accounts.spotify.com/authorize?${params.toString()}`;
    </script>
  </body>
</html>
